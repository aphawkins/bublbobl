SSG_EV_ENV_SHAPE= { addr = 0x2533, note = "F3: the hardware envelope: b0-2 its shape (register D, +33, with CONT set); b3-5 channels A-C play on it (+16 b5-7: volume 10, and their volume envelopes stop); b6-7 the channel whose new tone restarts it (+15: 0 none, 1 A, 2 B, 3 C)" }
SSG_EV_TONE_ENV = { addr = 0x2587, note = "F4, F5, F6: a stepped envelope on the tone period of channel A, B or C (slots +34, +45, +56, SSG_TONE_ENVS)" }
SSG_EV_MIXER    = { addr = 0x2591, note = "F7: the mixer (register 7, +27), b0-5" }
SSG_EV_VOL_ENV  = { addr = 0x2597, note = "F8, F9, FA: a stepped envelope on the volume of channel A, B or C (slots +78, +89, +100, SSG_VOL_ENVS)" }
SSG_EV_ENV_STOP = { addr = 0x25A1, note = "FF: an argument 0-F stops the envelope that F0+n started (SSG_ENV_SLOTS); others do nothing" }
SSG_EV_F_NONE   = { addr = 0x25BB, note = "FB-FE: the argument is skipped" }
SSG_ENV_START   = { addr = 0x260C, note = "HL = SSG_VOL_ENVS or SSG_TONE_ENVS, DE = a slot's offset, A = argument: as OPL_EV_ENV, into the 11-byte slot (IY): +0 flags, +1 interval, +2 count, +3 interval change, +4/+5 points, +6 next point, +7 loops, +8 next entry, +9 entry, +10 first interval" }
SSG_ENV_LOAD    = { addr = 0x2633, note = "E = entry, HL = table: as OPL_ENV_LOAD, into the slot at IY; DE = the points" }
SSG_MOD_TICK    = { addr = 0x265A, note = "every tick while playing: a new tone on +15's channel flags register D (the hardware envelope restarts); then the 7 envelopes: tones A-C (SSG_TONE_ENV_TICK), the noise period and volumes A-C (SSG_VOL_ENV_TICK)" }
SSG_TONE_ENV_TICK= { addr = 0x26C4, note = "IY = slot, D = the tone's bit in +17, E = its offset (+20, +22, +24): as OPL_ENV_TICK, restarted by a new tone; a step adds the next point - this one to the tone period, with no depth" }
SSG_VOL_ENV_TICK= { addr = 0x27A0, note = "IY = slot, E = the target's bit in +17, L = its offset (+26, +28-+30): as SSG_TONE_ENV_TICK, with 4-bit points (SSG_ENV_NIBBLES); the target is held in 0-F (0-1F with slot b1, the noise). On its first tick it stops if the channel plays on the hardware envelope (+16)" }
SSG_ENV_NIBBLES = { addr = 0x28A8, note = "HL = a points byte: B = this point (high nibble, then low, by slot b3), A = the next; carry set when the next is 0 (the end)" }

