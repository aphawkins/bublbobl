SHR4 = { addr = 0x0D62, note = "A >>= 4 (logical); SHR3 follows" }
SHR3 = { addr = 0x0D64, note = "A >>= 3 (logical)" }
SHL5 = { addr = 0x0D6C, note = "A <<= 5 (8 bit); SHL4 follows" }
SHL4 = { addr = 0x0D6D, note = "A <<= 4 (8 bit)" }
SAR6 = { addr = 0x0D72, note = "A >>= 6 (arithmetic): the top two bits as -2..1" }
TABLE_WORD = { addr = 0x0DA7, note = "DE = word at HL + 2*A: the jump and pointer table reader" }
