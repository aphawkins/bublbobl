DROWNED_COUNT = { addr = 0xE5EE, note = "enemies the water carries off (ENEMY_DEFEATED with +14 b2, which ENEMY_HIT_REACT sets from the ENEMY_HITS record's b2, the state WATER_ENEMY_TAKE writes): SPECIAL_RULES counter for kind 14 (4-7)" }
