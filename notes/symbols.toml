SECRET_GEMS_INIT = { addr = 0x5267, note = "SECRET_ROUND_INIT: the 0x24 gem records in BUBBLE_SLOTS (0x0A each): +8 the number, +3/+4 a sprite record from E20D, gfx 0C + 0x20 x (n mod 4) + n / 4, attribute 13" }
