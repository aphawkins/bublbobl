OPL_RECS       = { addr = 0x8440, size = 0x5A0, note = "ids 98-BA: the YM3526's 9 channels x 2 records of 0x50 (98 over 9A, 9C over 9E ...)" }
QUEUE_IN       = { addr = 0x8F80, note = "CMD_QUEUE index last written" }
QUEUE_OUT      = { addr = 0x8F81, note = "CMD_QUEUE index last read" }
CMD_QUEUE      = { addr = 0x8F82, size = 0x10, note = "16-byte ring of commands; when full the oldest is dropped" }
