# Single source of truth for names. Seeded from EXTRACTION_PLAN.md §2.
# Each table is one address space. Keys are names; values are { addr, size?, note? }.
# tools/symbols.py exports them as build/include/<cpu>.inc (.equ lines) for the assembler.
# [shared.mcu] is the RAM the main CPU and the MCU share: addresses are main-CPU (FC00-FFFF);
# the MCU include gets the same names at addr & 0xFFF (the MCU sees it at 0C00-0FFF).

[main.io]
SOUND_CMD     = { addr = 0xFA00, note = "W: sound command / R: sound reply" }
SOUND_SEMA    = { addr = 0xFA01, note = "R: sound semaphores" }
SOUND_RESET   = { addr = 0xFA03, note = "sound CPU reset" }
WATCHDOG      = { addr = 0xFA80 }
SUB_NMI       = { addr = 0xFB00, note = "NMI to sub CPU" }
BANK_CTRL     = { addr = 0xFB40, note = "b0-2 bank ((d^4)&7), b4 sub reset, b5 MCU reset, b6 video enable, b7 flip" }

[main.mem]
BANK_WINDOW   = { addr = 0x8000, size = 0x4000, note = "a78-05-1.52 page; write 4-7 to FB40 for pages 0-3" }
OBJ_TILES     = { addr = 0xC000, size = 0x1D00, note = "tile-column data for objects, 0x80 bytes per gfx_num" }
OBJ_RAM       = { addr = 0xDD00, size = 0x0300, note = "4 bytes/object: Y, gfx#, X, attr" }
SHARED_RAM    = { addr = 0xE000, size = 0x1800, note = "work RAM shared with sub CPU" }
PALETTE_RAM   = { addr = 0xF800, size = 0x0200, note = "256 x RGBx_444 big-endian" }
MCU_RAM       = { addr = 0xFC00, size = 0x0400, note = "RAM shared with MCU, names in [shared.mcu]" }
OBJ_SHADOW    = { addr = 0xE1CD, size = 0x0168, note = "objects 0-89 as built this frame; OBJ_COPY copies it to OBJ_RAM at the next IRQ" }
SCHED_FREE    = { addr = 0xE194, note = "1 when the scheduler is not running; 0 inside it, when an IRQ only runs FRAME_TICK on the stack at E1C5" }
RAND_STATE    = { addr = 0xE37F, size = 2, note = "16-bit random state: RAND_INC, RAND_DEC and RAND_MIX" }
SOUND_QUEUE   = { addr = 0xE381, size = 0x10, note = "sound commands waiting for SOUND_QUEUE_POP" }
SOUND_QUEUE_LEN = { addr = 0xE391, note = "commands in SOUND_QUEUE" }
FB40_COPY     = { addr = 0xE1CB, note = "last value written to FB40" }
BANK_SAVED    = { addr = 0xE1CC, note = "bank bits before BANK_SELECT; BANK_RESTORE puts them back" }
ROUND_RECORD  = { addr = 0xE598, note = "0x2B bytes: the round's record from bank1:ROUND_RECORDS, shifted by DIFFICULTY and SUPER_MODE; fields in notes/levels.md" }
SUPER_MODE    = { addr = 0xE5DB, note = "nonzero: LOAD_ROUND_REC swaps enemy kinds and groups, LOAD_ROUND_PAL uses record byte 14. Set by CODE_CHECK (S J B L R J S R on the title, 1C06) and MODE_SELECT (2A18); cleared by MODE_SELECT and on the way back to the attract loop (20C7)" }
CODE_INPUTS   = { addr = 0xE5C8, size = 8, note = "the first 8 changes of P1's inputs (IN1_COPY & 7F) on the title; CODE_COUNT in E5D0, the last input in E5C7" }
ORIGINAL_GAME = { addr = 0xE5D1, note = "1 = the B J B J B J R S code passed its ROM checks ('ORIGINAL GAME...'); cleared with SUPER_MODE" }
POWER_UP      = { addr = 0xE5D2, note = "1 = the L J L S L B L S code ('POWER UP!'): each player gets the round 100 values of IX+2E-30 (3FE1); cleared with SUPER_MODE" }
ATTRACT       = { addr = 0xE5D3, note = "1 in the attract loop (1D33), 0 once a game starts (1DA1)" }
DIFFICULTY    = { addr = 0xE5DC, note = "0-1E: from DSW1 b0-1 through the table at 22D6 (22C6), or 7 (2B3A, 2EE0); raised (22F0) and lowered (22FE) in play. LOAD_ROUND_REC shifts record bytes 7, 8, 13, 15 by it" }
ROUND_SECONDS = { addr = 0xE345, note = "seconds into the round (E344 counts the frames); HURRY UP when it reaches record byte 13" }
HURRY         = { addr = 0xE349, note = "1 = HURRY UP has been shown (0832); FF = one enemy left (0730). The enemies speed up while it is nonzero" }
GHOST_ON      = { addr = 0xE343, note = "FF = Skel-Monsta is out: record byte 15 seconds after HURRY UP (087E)" }
NO_SPECIAL    = { addr = 0xE34A, note = "1 = 3 s before HURRY UP: no special item appears after that (0770)" }
SPECIAL_LIST  = { addr = 0xE745, size = 0x10, note = "16 bubble types for SPAWN_BUBBLE to pick from: record bytes 38-41 give how many are 1 (lightning), 2 (water), 3 (fire), 4; the rest 0 (plain)" }
PLAYER_NOW    = { addr = 0xE5D6, note = "0 = player 1 is playing, nonzero = player 2: picks SCORE_P1 or SCORE_P2 and their companion records" }
SCORE_P1      = { addr = 0xE641, size = 3, note = "player 1's score: 6 BCD digits, low byte first; SCORE_ADD saturates at 999999" }
SCORE_P2      = { addr = 0xE646, size = 3, note = "player 2's score, as SCORE_P1" }
HIGH_SCORE    = { addr = 0xE64C, size = 3, note = "the high score, as SCORE_P1; starts from BONUS_TABLE_PTR entry 0 (31E1), HIGH_SCORE_CHECK raises it" }
LIVES_P1      = { addr = 0xE645, note = "player 1's lives: 3 at the title, +1 per extra life (cap 0x64)" }
LIVES_P2      = { addr = 0xE64A, note = "player 2's lives" }
BONUS_NEXT_P1 = { addr = 0xE639, size = 3, note = "the score at which player 1 gets the next extra life (a BONUS_TABLE_PTR entry); the number given so far is E63F, at most 8" }
BONUS_NEXT_P2 = { addr = 0xE63C, size = 3, note = "as BONUS_NEXT_P1 for player 2; count in E640" }
POINTS_ITEM   = { addr = 0xE2AD, size = 4, note = "object: the points item, at record bytes 1-2 (Y, X)" }
SPECIAL_ITEM  = { addr = 0xE2B1, size = 4, note = "object: the special item, at record bytes 10-11 (Y, X)" }
POINTS_KIND   = { addr = 0xF44C, note = "the points item: entry in bank2:POINTS_ITEMS" }
POINTS_FLAG_U = { addr = 0xF452, note = "1 = a special item of kind 06-08 was taken (bank2:8856): the next points item is from POINTS_FLAGS entry 2" }
POINTS_FLAG_H = { addr = 0xF453, note = "1 = HURRY UP came (0837): the next points item is from POINTS_FLAGS entry 1" }
POINTS_FLAG_G = { addr = 0xF454, note = "1 = Skel-Monsta came (0883): the next points item is from POINTS_FLAGS entry 0" }
ROUND_CLOCK   = { addr = 0xF456, note = "seconds since the round started, not reset by a death (F455 counts the frames); POINTS_PICK clears F44E-F456 after reading it" }
POINTS_STATE  = { addr = 0xF44F, note = "b0 shown, b1 taken (its score rises), b2 a pause, b3 done" }
POINTS_TIMER  = { addr = 0xF450, size = 2, note = "frames: 1A4 (F0 if F44D) until it appears, then 258 on show" }
SPECIAL_KIND  = { addr = 0xF45E, note = "the special item: entry in bank2:SPECIAL_ITEMS" }
BANK2_SUM     = { addr = 0xF45D, note = "bank3:938A (FA), copied at 2529: the sum of bank2 9532-B787, every other byte, that BANK2_CHECK expects" }
SKIP_KINDS    = { addr = 0xE612, note = "set to 3 by special kind 2F (bank2:8AA9): the next 3 special items are kinds 0B, 0A, 09" }
SPECIAL_STATE = { addr = 0xF45F, note = "as POINTS_STATE" }
SPECIAL_TIMER = { addr = 0xF461, size = 2, note = "frames: 2D0 (F0 if F44D) until it appears, then 384 on show" }
MAIN_FRAME    = { addr = 0xE338, note = "stepped by the main CPU's interrupt (04D3); the sub CPU's MAIN_WATCHDOG wrecks RAM if it stops for 0x3C frames" }
P1_REC        = { addr = 0xE691, size = 0x32, note = "player 1: +0 b0 alive (the sub CPU writes 0x10 when it is hit), +1 Y, +2 X, +8 b0 facing, +9 player number; fields the sub CPU reads in src/sub/sub.s" }
P2_REC        = { addr = 0xE6C3, size = 0x32, note = "player 2, as P1_REC" }
BUBBLE_COUNT  = { addr = 0xE76B, note = "bubble slots in use (BUBBLE_SLOTS)" }
BUBBLE_SLOTS  = { addr = 0xE76C, note = "0x28 bytes each: +0 state (b0-b7, main dispatch at 5C37), +1 Y, +2 X, +0F direction, +13/+14 pushes in Y/X, +1A hit flags from the sub CPU" }
ENEMY_HITS    = { addr = 0xED21, size = 0x1C, note = "7 x 4 bytes, one per enemy: +0 b0 can be hit, b3 marked (+3 = 1 / FF by the player who touched it); the sub CPU writes 0x10 (killed, +3 = 6 or 8) or 2 (beaten by a player); +1 Y, +2 X" }
SUB_CHECKS    = { addr = 0xF66B, note = "'I' (49): the sub CPU runs its hit tests. Set at 080D and 4E47, cleared at 0660 and 078D" }
WATCH_LAST    = { addr = 0xF66C, note = "sub: MAIN_FRAME as last seen" }
WATCH_COUNT   = { addr = 0xF66D, note = "sub: frames MAIN_FRAME has not changed" }
SUB_FRAMES    = { addr = 0xF66E, note = "sub: frame counter" }
POP_FLAG      = { addr = 0xF66F, note = "sub: 1 = a bubble popped this frame; F670-F672 its +1D, Y, X; POP_CHAIN pops its neighbours next frame" }
POP_CHAIN_N   = { addr = 0xF673, note = "sub: enemy bubbles popped in this chain" }
POP_DIRECTION = { addr = 0xF674, note = "sub: facing of the player who popped or pushed, for the chain" }
POP_ENEMIES   = { addr = 0xF677, size = 4, note = "per player (2 bytes each): enemy bubbles popped, and a flag the sub CPU sets when the count is nonzero. Read by the main CPU at 4605 and 45FD, cleared at 5B8B" }
GRID_REQUEST  = { addr = 0xE397, note = "LOAD_GRID_EDGES sets 1 and waits; the sub CPU's GRID_UNPACK fills ROUND_GRID rows 5-28 and sets FF" }
ROUND_GRID    = { addr = 0xE398, size = 0x200, note = "32 x 32 cells of 8 x 8, 16 bytes a row, high nibble first: 0 = wall, 1-4 = open (air current?). Rows 0-4 and 29-31 from LOAD_GRID_EDGES, 5-28 from the sub CPU" }
GRID_DRAW_ROW = { addr = 0xE5C4, note = "next ROUND_GRID row DRAW_GRID_ROW draws at round start; 0x20 when done" }
ROUND_MAIN    = { addr = 0xE64B, note = "main CPU copy of the round number (MCU ROUND) from 0; 100 (0x64) in the title and attract screens; b0 picks palette 14 or 15" }
ENEMY_SWAP    = { addr = 0xE5A4, note = "ROUND_RECORD byte 12: b0 = group 0 is ENEMY0B, not ENEMY0; b4 = group 2 is ENEMY2B, not ENEMY2" }
ENEMY_TOTAL   = { addr = 0xED3D, note = "sum of ENEMY_COUNTS" }
ENEMY_COUNTS  = { addr = 0xED3E, size = 6, note = "enemies in groups 0-5: the nibbles of ROUND_RECORD bytes 4-6, high nibble first" }
ENEMY0_SLOTS  = { addr = 0xED49, size = 0xAF, note = "group 0, 0x19 bytes each (drew Zen-chan in the traced rounds)" }
ENEMY0B_SLOTS = { addr = 0xF2AA, note = "group 0 when ENEMY_SWAP b0, 0x19 bytes each (drew Invader in the traced rounds)" }
ENEMY0B_SHOTS = { addr = 0xECAA, note = "group 0's swapped kind's shots, 0x11 bytes each (drew Invader's laser)" }
ENEMY1_SLOTS  = { addr = 0xEDF8, note = "group 1, 0x19 bytes each (drew Banebou in the traced rounds)" }
ENEMY2_SLOTS  = { addr = 0xEEAC, note = "group 2, 0x23 bytes each (drew Mighta in the traced rounds)" }
ENEMY2_SHOTS  = { addr = 0xEC29, note = "group 2's thrown objects (Mighta's rock)" }
ENEMY2B_SLOTS = { addr = 0xF1E7, note = "group 2 when ENEMY_SWAP b4, 0x19 bytes each (drew Drunk in the traced rounds)" }
ENEMY2B_SHOTS = { addr = 0xF3CE, size = 0x77, note = "group 2's swapped kind's shots, 7 x 0x11 (drew Drunk's bottles)" }
ENEMY3_SLOTS  = { addr = 0xEFA1, note = "group 3, 0x1B bytes each (drew Hidegons in the traced rounds)" }
ENEMY3_SHOTS  = { addr = 0xEB99, size = 0x90, note = "group 3's shots, 0x12 bytes each, set up by ENEMY3_SHOTS_INIT (drew Hidegons' fireballs)" }
ENEMY4_SLOTS  = { addr = 0xF05F, note = "group 4, 0x19 bytes each (drew Pulpul in the traced rounds)" }
GHOST_SLOTS   = { addr = 0xF1C2, note = "set up by GHOST_INIT; drew Skel-Monsta, the skull ghost, in the traced rounds" }
BOSS_SLOT     = { addr = 0xF296, size = 0x14, note = "the round 100 boss, set up by BOSS_INIT (drew Super Drunk). +0B = hits taken: from 0x46 it flashes (bank0:AE73), from 0x50 bank0:A960 traps it in a bubble (+0 = 2) when X is 80-87; unpopped, it escapes angry (+0 = 9) with hits 0" }
BOSS_SHOTS    = { addr = 0xF367, size = 0x67, note = "the boss's bottles, 0x0C bytes each, set up by BOSS_SHOTS_INIT" }
ENEMY5_SLOTS  = { addr = 0xF113, note = "group 5, 0x19 bytes each (drew Monsta in the traced rounds)" }

[main.code]
RESET          = { addr = 0x0000, note = "DI / IM 2 / JP 00B9" }
START          = { addr = 0x00B9 }
IDLE           = { addr = 0x01ED, note = "jr $: after start-up the main CPU only runs the IRQ handler" }
IRQ_HANDLER    = { addr = 0x044D, note = "IM 2, through the vector entry at 0B2E" }
BANK_SELECT    = { addr = 0x026C, note = "A = page 0-3 of a78-05-1; FB40 value from BANK_PAGES" }
BANK_RESTORE   = { addr = 0x029B, note = "back to the bank saved in BANK_SAVED" }
OBJ_COPY       = { addr = 0x04AD, note = "OBJ_SHADOW -> OBJ_RAM, 0x168 bytes, at the start of each IRQ" }
GFX_QUARTER    = { addr = 0x145D, note = "A = gfx_num -> IY = its quarter of the gfx block: C000 + (A & 1F) * 80 + ((A >> 1) & 30)" }
SPRITE         = { addr = 0x147D, note = "16 x 16 sprite: A = gfx_num, B = first of 4 tiles, C = tile attribute; writes rows 6-7 of the quarter" }
SPRITE_FLIPX   = { addr = 0x149C, note = "as SPRITE, mirrored: sets C b6 and swaps the columns" }
SPRITE_LIST    = { addr = 0x14BD, note = "B sprites from the tile list at HL, gfx numbers from (IX+7)" }
SPRITE_LIST_FX = { addr = 0x14E1, note = "as SPRITE_LIST through SPRITE_FLIPX" }
SPRITE_RECS    = { addr = 0x1505, note = "B sprites from 3-byte records at HL: gfx_num, tile, attribute" }
SPRITE_RECS_FX = { addr = 0x1517, note = "as SPRITE_RECS through SPRITE_FLIPX" }
ANIM_STEP      = { addr = 0x15CA, note = "E = frame count, D = delay: steps (IX+6) delay and (IX+5) frame; returns the frame in A" }
PLAYER_SPRITE  = { addr = 0x450D, note = "player frame from PLAYER_ANIMS[(IX+12)] (FF = none), colour (IX+1A), flip (IX+8) b0" }
LOAD_PALETTES  = { addr = 0x0B30, note = "bank1:PALETTES -> F800, 0x200 bytes" }
LOAD_ROUND_PAL = { addr = 0x0B43, note = "bank1:ROUND_PALETTES[index] -> palette 14 (F9C0) or 15 (F9E0) by ROUND_MAIN b0" }
GRID_CELL      = { addr = 0x174B, note = "A = the ROUND_GRID cell at object X = H, Y = L (row (-L) / 8, column H / 8); the collision probes around objects call it" }
LOAD_ROUND_REC = { addr = 0x1775, note = "bank1:ROUND_RECORDS[ROUND_MAIN] -> ROUND_RECORD; then (not on the title) the SUPER_MODE swaps and the DIFFICULTY shifts" }
HURRY_CHECK    = { addr = 0x0742, note = "HURRY UP when ROUND_SECONDS = record byte 13; NO_SPECIAL 3 s before" }
GHOST_CLOCK    = { addr = 0x085F, note = "while HURRY = 1: seconds in E348; past record byte 15, GHOST_ON" }
BUBBLE_SPEED   = { addr = 0x6144, note = "steps from the SPEED_PATTERNS row SPEED2_SEL (record byte 9), then BUBBLE_DRIFT for each" }
BUBBLE_DRIFT   = { addr = 0x6175, note = "one pixel by the bubble's cell (IX+0A): 0-1 up (Y+1), 2 right, 3 left, 4 down, 5-6 stay; re-reads the cell on an 8-pixel boundary (61E4)" }
BUBBLE_TIMER   = { addr = 0x60B6, note = "(IX+0C) frames to 3C, then (IX+0D) seconds down; at FF the bubble pops or its enemy escapes" }
SPAWN_BUBBLE   = { addr = 0x6D9B, note = "every E75C frames, under 16 bubbles: a bubble from the floor or ceiling gaps (record byte 3; none when it is AA), type from SPECIAL_LIST" }
LOAD_GRID_EDGES = { addr = 0x1700, note = "asks the sub CPU for ROUND_GRID rows 5-28 (GRID_REQUEST), then copies rows 0-4 and 29-31 from bank1:GRID_EDGES by ROUND_RECORD byte 3's nibbles" }
GRID_WALL_TILE = { addr = 0x1929, note = "HL = 0x204 + 5 x ROUND_MAIN with colour 14/15: the side-wall block; +4 is the wall tile" }
DRAW_GRID_ROW  = { addr = 0x1958, note = "ROUND_GRID row GRID_DRAW_ROW -> tile columns CD00-D4FF: wall tile where a cell is 0" }
SHADE_GRID_ROW = { addr = 0x199C, note = "shadow tiles F0-F5 in the row's open cells, by the walls above, left and above-left" }
SIDE_WALL_ROW  = { addr = 0x1A99, note = "columns 0-1 and 30-31 of a row: the 2 x 2 side-wall block where the wall tile is" }
TITLE_CODE_RESET = { addr = 0x1BBA, note = "CODE_INPUTS and E5C7 to 7F, CODE_COUNT to 0, as the title starts (1AED)" }
CODE_CHECK     = { addr = 0x1BCF, note = "each title frame: records a change of P1's inputs; at the 8th, compares CODE_INPUTS with TITLE_CODES" }
MODE_SELECT    = { addr = 0x2931, note = "at game start, if SUPER_MODE: SELECT GAME MODE, left NOMAL GAME (29CC), right SUPER GAME (29FC), either button starts; after 0x4B0 frames the normal game" }
CYCLE_COLOUR   = { addr = 0x1B90, note = "steps palette 1 colour 14 through CYCLE_1_14" }
RED_RAMP_STEP  = { addr = 0x2873, note = "steps palette 1 colour 1 through RED_RAMP" }
LOAD_PAL_7_8   = { addr = 0x3C60, note = "PALETTES_7_8 -> F8E0" }
ENEMY3_SHOTS_INIT = { addr = 0x79E9, note = "clears ENEMY3_SHOTS (8 x 0x12), then sets them up if ENEMY_COUNTS group 3 is nonzero; called from bank0:ROUND_ENEMIES" }
TAMPER_CHECK   = { addr = 0x333F, note = "low byte of the IM 2 vector entry at 0B2E must be 4D; else runs 'dead copy' at 334A" }
SWB7_SCORE_A   = { addr = 0x0F26, note = "F7FE/F7FF score output mystery" }
SWB7_SCORE_B   = { addr = 0x0F74 }
NAME_TABLE_LD  = { addr = 0x375A }
TASK_KILL = { addr = 0x0008, note = "RST 08: task A stops (its timer E000+A = 0)" }
TASK_START = { addr = 0x0010, note = "RST 10: task A runs at the next scheduler pass (timer = 1)" }
TASK_SLEEP = { addr = 0x0018, note = "RST 18: the running task saves its registers and sleeps A frames (0 = until started)" }
TASK_YIELD = { addr = 0x0020, note = "RST 20: as TASK_SLEEP with A = 1" }
TASKS_CLEAR = { addr = 0x0028, note = "RST 28: stops all 6 tasks (E000-E005 = 0)" }
TASK_SPAWN = { addr = 0x0030, note = "RST 30: starts task A with a new stack in E020+, entered at word A of the table at 0B22" }
SCHEDULER = { addr = 0x005E, note = "each frame: counts down the 6 task timers E000-E005; a task reaching 0 is resumed from its saved SP (E006 + 2 x task)" }
SCHED_NEXT = { addr = 0x0086, note = "next task slot; returns after slot 5" }
CLEAR_B = { addr = 0x008D, note = "B bytes at HL = 0" }
TASK_SWITCH = { addr = 0x0093, note = "saves the registers on the task's stack, stores SP in E006+2n and goes back to the scheduler's stack" }
WORK_RAM_FAIL = { addr = 0x01EF, note = "work RAM test failed: WORK RAM ERROR" }
HALT_FAIL = { addr = 0x020C, note = "video off, RUN_KEY = 0, then spins forever" }
COMMON_RAM_FAIL = { addr = 0x0218, note = "MCU shared RAM test failed: COMMON RAM ERROR" }
SET_E1D0_10 = { addr = 0x02AC, note = "first byte of 16 4-byte records at E1D0 = 10" }
SET_E1D0_11 = { addr = 0x02BA, note = "first byte of 16 4-byte records at E1D0 = 11" }
SET_E1D0_19 = { addr = 0x02C8, note = "first byte of 16 4-byte records at E1D0 = 19" }
SET_E1D0_1A = { addr = 0x02D6, note = "first byte of 16 4-byte records at E1D0 = 1A" }
SET_E2F8_10 = { addr = 0x02E4, note = "first byte of 16 4-byte records at E2F8 = 10" }
SET_E2D8_11 = { addr = 0x02F2, note = "first byte of 16 4-byte records at E2D8 = 11" }
SET_E2F8_1A = { addr = 0x0300, note = "first byte of 16 4-byte records at E2F8 = 1A" }
SET_E2F8_1B = { addr = 0x030E, note = "first byte of 16 4-byte records at E2F8 = 1B" }
SET_E1D2_SEQ = { addr = 0x031C, note = "E1CE = 9A; first byte of 16 4-byte records from E1D2 = DB, DC, ..." }
SET_E2F5_RECS = { addr = 0x0330, note = "clears E2D5, then 16 records (0, word from 0352 + 2n, 0) at E2F5" }
SET_E2D5_RECS = { addr = 0x0372, note = "clears E2F5, then 16 records (0, word from 0394 + 2n, 0) at E2D5" }
ADD_DE_A = { addr = 0x0D84, note = "DE += A" }
HIGH_SCORE_CHECK = { addr = 0x2FC9, note = "if the current player's score is not below HIGH_SCORE, copy it there and redraw (2FE4: tile D006, then 340B)" }
SCORE_SHOW = { addr = 0x2FF0, note = "SCORE_DRAW of the current player's score at CD46 (player 1) or D286 (player 2)" }
SCORE_DRAW = { addr = 0x3002, note = "draw a 6-digit BCD score: HL = tile RAM, DE = its high byte; digit tile 0x7B + n, leading zeros blank, a column per digit (0x40 apart)" }
