SECRET_DROP_GAP = { addr = 0x52B6, note = "once 0x18 gems are taken (E725): every 30 frames one of 3 steps of tiles from 533B (4 bytes to D0E6 and D126), then E72B b1; after that a player whose sprite is at Y 58, X 77-79 is put at Y 18" }
SECRET_EXIT_GAP = { addr = 0x5353, note = "once all 0x24 gems are taken: every 30 frames one of 2 steps of tiles from 5406 (to D0F6 and D136), then E731 b1; after that a player at Y 18, X 77-79 runs SECRET_ROUND_EXIT" }
SECRET_ROUND_EXIT = { addr = 0x53CF, note = "leaves the secret room: ends task 3, SCREEN_FLASH, ROUND_MAIN = E726 (the round after the one left), sound 30, E723 and SECRET_DEATH 0, ENEMY_TOTAL 0 (the round is over), then sleeps. From SECRET_EXIT_CHECK, or 539F when E731 b1 is set and a playing player's object stands at Y 18, X 77-79" }
