OPN_LAYER      = { addr = 0x8F9D, note = "BLOCK_NOW: 0 = the first record of the channel's pair, 1 = the second" }
REG27_BASE     = { addr = 0x8F9E, note = "YM2203 register 27 (timer control) as SOUND_START set it, low nibble; OPN_VOICE_WRITE ORs in 40 for channel 3 special mode" }
OPN_TIMER_MODE = { addr = 0x8F9F, note = "b0: write 5F/6F, not 1F/2F, to register 27 (channel 3 special mode)" }
OPL_TAKEN      = { addr = 0x8FA0, size = 2, note = "9 bits: a channel's A record played this tick (OPL_TICK_A); OPL_TICK_B clears them" }
OPL_LAYER      = { addr = 0x8FA2, note = "as OPN_LAYER, for the YM3526" }
OPN_TIMER_A    = { addr = 0x8FA3, size = 2, note = "10-bit timer A value, loaded at the next IRQ when TIMER_A_NEW b0 is set" }
CC_B4_BYTE     = { addr = 0x8FA5, note = "the byte after CC B4 (TIMER_A_NEW b1); nothing reads it" }
CC_B5_BYTE     = { addr = 0x8FA6, note = "the byte after CC B5 (TIMER_A_NEW b2); nothing reads it" }
CC_B6_BYTE     = { addr = 0x8FA7, note = "the byte after CC B6 (TIMER_A_NEW b3); nothing reads it" }
TIMER_A_NEW    = { addr = 0x8FA8 }
SSG_TAKEN      = { addr = 0x8FA9, note = "1 while SSG_REC_A plays" }
SOUND_ON       = { addr = 0x8FAA, note = "0 after reset and command EE: BLOCK_START starts nothing; 1 after EF" }
SOUND_MODE     = { addr = 0x8FAB, note = "b0 (command F0 flips it): commands below E0 are not played but kept in ECHO_CMD as the reply; b7: OPL_TIMER_STOP has run" }
ECHO_CMD       = { addr = 0x8FAC }

[sound.code]
RESET = { addr = 0x0000 }
IRQ   = { addr = 0x0038, note = "IM 1, from the YM chips' timers" }
NMI   = { addr = 0x0066, note = "from the command latch: every command but FF goes into CMD_QUEUE (and to DIAG_ROM, if fitted)" }
QUEUE_PUSH      = { addr = 0x00B3, note = "A = command below F0: added to CMD_QUEUE, carry clear; F0 and up: carry set, not added" }
SOUND_START     = { addr = 0x00DC, note = "clears RAM; YM2203 timers A = 150 and B = D5, SSG off (SSG_OFF_CHECK); YM3526 timer 1 started; reply E0, then MAIN_LOOP" }
TAMPER_OP_0144  = { addr = 0x0144, note = "an opcode TAMPER_CHECK reads: CD" }
MAIN_LOOP       = { addr = 0x016D, note = "QUEUE_RUN with interrupts off, REPLY_READY, DIAG_ROM_CHECK; for ever" }
SSG_OFF_CHECK   = { addr = 0x017A, note = "HL = YM2203: register 7 (mixer) = 3F, all SSG tones and noise off; resets the CPU if it does not read back" }
TAMPER_OP_0191  = { addr = 0x0191, note = "an opcode TAMPER_CHECK reads: FE" }
IRQ_HANDLER     = { addr = 0x0195, note = "YM2203 timer A: OPL_TICK_A, OPL_TICK_B; timer B: OPN_FM_TICK, OPN_SSG_TICK; a new timer A value; TAMPER_CHECK. RET, not RETI: MAIN_LOOP has the EI" }
TAMPER_OP_019D  = { addr = 0x019D, note = "an opcode TAMPER_CHECK reads: CD" }
OPL_TIMER_STOP  = { addr = 0x022B, note = "first IRQ only: waits for the YM3526's timer 1 (SOUND_START), then resets its IRQ and stops it" }
REPLY_READY     = { addr = 0x024D, note = "reply ECHO_CMD in echo mode (SOUND_MODE b0), else E0 while NMI_ENABLE b0 reads clear" }
DIAG_ROM_CHECK  = { addr = 0x0268, note = "with DIAG_ROM fitted: if E00F gives NZ and E009 gives 53 ('S'), reset" }
TAMPER_CHECK    = { addr = 0x0279, note = "six opcode bytes in 0144-022B must be as built, else reset" }
QUEUE_RUN       = { addr = 0x02A3, note = "until CMD_QUEUE is empty: 00-34 COMMAND_START (echo mode: ECHO_CMD), 35-DF ignored, E0-EF COMMAND_E, F0-FE COMMAND_F" }
COMMAND_START   = { addr = 0x02EF, note = "A = command: its COMMAND_TABLE entry is a count of block words, or one block (first byte 1B and up)" }
COMMAND_BLOCKS  = { addr = 0x02FE, note = "BC = entry, D = command: a word with high byte 0 queues its low byte as another command; any other is a block for BLOCK_START" }
BLOCK_START     = { addr = 0x0332, note = "BC = block, A = its record id: unless SOUND_ON is 0 the record (RECORD_TABLE) is started at the block, with D as its command; ids F0/F1 go to BLOCK_NOW. A record playing (+0 b1) with +5 below the block's +1 high nibble is left alone" }
COMMAND_E       = { addr = 0x03B0, note = "EE: SOUND_ON = 0; EF: SOUND_ON = 1; the rest do nothing" }
BLOCK_NOW       = { addr = 0x03C5, note = "BC = an F0/F1 block: the byte after names a record, and the bytes after that are applied to it at once (SSG_EVENTS, OPN_EVENTS, OPL_EVENTS)" }
COMMAND_F       = { addr = 0x044B, note = "F0-FE through COMMAND_F_JUMPS" }
ECHO_TOGGLE     = { addr = 0x045D, note = "command F0: flips SOUND_MODE b0" }
COMMAND_F_ENTRY = { addr = 0x046E, note = "commands F2, F4, F6, F8: COMMAND_BLOCKS from COMMAND_F_TABLE" }
COMMAND_F_NONE  = { addr = 0x0480 }
SEQ_END_NOTIFY  = { addr = 0x049F, note = "a record's sequence has ended: with +4 b0 its command (+3) is the reply, waiting until NMI_ENABLE b0 reads clear; then +8 is queued as the next command (and sent to DIAG_ROM, if fitted)" }
OPL_TICK_A      = { addr = 0x04D8, note = "timer A: the YM3526's 9 A records (98, 9C ... B8); each one playing sets its bit in OPL_TAKEN" }
OPL_TICK_B      = { addr = 0x0535, note = "the 9 B records (9A, 9E ... BA), each skipped while its A record plays; one whose OPL_TAKEN bit is set is flagged to rewrite its voice" }
OPL_RECS_STEP   = { addr = 0x05C4, note = "IX = HL = a layer's first record: for each of the 9 channels OPL_REC_START if asked (+0 b0); while playing (+0 b1) the gate count (+20) keys off at 0, the duration (+18) runs OPL_STEP at 0, then OPL_MOD_TICK. +9 = the channel" }
